<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outpatient Clinic Appointment Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>🏥 Outpatient Clinic</h1>
            <p>Appointment Planner</p>
        </div>

        <button class="add-btn" onclick="openModal()">
            + Add Appointment
        </button>
    </header>

    <main class="container">

        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <div class="stat-icon blue">📅</div>
                <div>
                    <h3 id="totalCount">0</h3>
                    <p>Total Appointments</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon orange">⏳</div>
                <div>
                    <h3 id="waitingCount">0</h3>
                    <p>Waiting</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon purple">🩺</div>
                <div>
                    <h3 id="progressCount">0</h3>
                    <p>In Progress</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">✓</div>
                <div>
                    <h3 id="completeCount">0</h3>
                    <p>Completed</p>
                </div>
            </div>

        </section>

        <!-- Filters -->
        <section class="filter-box">

            <div class="filter-group">
                <label>Search Patient</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search patient..."
                    oninput="renderAppointments()"
                >
            </div>

            <div class="filter-group">
                <label>Doctor</label>
                <select id="doctorFilter" onchange="renderAppointments()">
                    <option value="All">All Doctors</option>
                    <option value="Sneha">Dr. Sneha</option>
                    <option value="Madhu">Dr. Madhu</option>
                    <option value="Gopi">Dr. Gopi</option>
                    <option value="Janu">Dr. Janu</option>
                    <option value="Deekshi">Dr. Deekshi</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter" onchange="renderAppointments()">
                    <option value="All">All Status</option>
                    <option value="Waiting">Waiting</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Complete">Complete</option>
                </select>
            </div>

            <button class="clear-btn" onclick="clearFilters()">
                Clear Filters
            </button>

        </section>

        <!-- Appointment Board -->
        <section class="appointment-section">

            <div class="section-title">
                <div>
                    <h2>Today's Appointments</h2>
                    <p>Manage outpatient clinic appointments</p>
                </div>

                <span id="appointmentNumber" class="appointment-number">
                    0 appointments
                </span>
            </div>

            <div id="appointmentList" class="appointment-list"></div>

        </section>

    </main>

    <!-- Add Appointment Modal -->
    <div id="appointmentModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h2>Add Appointment</h2>
                    <p>Create a new patient appointment</p>
                </div>

                <button class="close-btn" onclick="closeModal()">×</button>
            </div>

            <form id="appointmentForm">

                <div class="form-row">

                    <div class="form-group">
                        <label>Patient Name</label>
                        <input
                            type="text"
                            id="patientName"
                            placeholder="Enter patient name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input
                            type="number"
                            id="patientAge"
                            min="1"
                            max="120"
                            placeholder="Age"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Doctor</label>

                        <select id="doctorName" required>
                            <option value="">Select Doctor</option>
                            <option value="Sneha">Dr. Sneha</option>
                            <option value="Madhu">Dr. Madhu</option>
                            <option value="Gopi">Dr. Gopi</option>
                            <option value="Janu">Dr. Janu</option>
                            <option value="Deekshi">Dr. Deekshi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Appointment Time</label>

                        <input
                            type="time"
                            id="appointmentTime"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label>Reason / Symptoms</label>

                    <input
                        type="text"
                        id="reason"
                        placeholder="e.g. Fever, headache, check-up"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select id="appointmentStatus">

                        <option value="Waiting">
                            Waiting
                        </option>

                        <option value="Confirmed">
                            Confirmed
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Complete">
                            Complete
                        </option>

                    </select>
                </div>

                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Add Appointment
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
